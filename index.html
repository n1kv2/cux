<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Traduttore cUX.">
<title>cUX</title>
<style>
:root{color-scheme:light;--ink:#171816;--muted:#70736d;--line:#dedfd9;--surface:#fff;--soft:#f5f5f1;--accent:#233d31;--accent-hover:#182c23;--danger:#9b342d;--shadow:0 24px 70px rgba(29,34,30,.09)}
*{box-sizing:border-box}
html{min-width:320px;background:var(--soft)}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--soft);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit}button{color:inherit}
.shell{width:min(1100px,calc(100% - 40px));margin:0 auto;padding:48px 0}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}
.identity{display:flex;align-items:baseline;gap:14px}
.identity h1{margin:0;font-size:clamp(2rem,5vw,3.5rem);font-weight:760;letter-spacing:-.07em;line-height:.9;cursor:pointer}
.identity span{color:var(--muted);font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.clear-button,.copy-button,.swap-button,.mode-button,.translate-button{border:0;cursor:pointer}
.clear-button{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:.9rem;font-weight:750}
.clear-button:hover{background:var(--soft)}
.translator{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mode-switch{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--soft)}
.mode-button{padding:9px 14px;border-radius:9px;background:transparent;color:var(--muted);font-size:.88rem;font-weight:720;transition:background 160ms ease,color 160ms ease,box-shadow 160ms ease}
.mode-button[aria-selected=true]{color:var(--ink);background:var(--surface);box-shadow:0 1px 5px rgba(25,29,26,.09)}
.swap-button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--surface);font-size:1.1rem;line-height:1}
.swap-button:hover{background:var(--soft)}
/* barra livello */
.levelbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafaf7}
.levelbar.hidden{display:none}
.level-switch{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--soft);flex:1}
.level-btn{flex:1;padding:8px 10px;border-radius:9px;background:transparent;color:var(--muted);font-size:.82rem;font-weight:720;border:0;cursor:pointer;transition:background 160ms ease,color 160ms ease,box-shadow 160ms ease}
.level-btn[aria-selected=true]{color:var(--ink);background:var(--surface);box-shadow:0 1px 5px rgba(25,29,26,.09)}
/* barra chiave */
.keybar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafaf7}
.keybar label{font-size:.8rem;font-weight:760;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.keybar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:0}
.keybar input:focus{outline:3px solid rgba(35,61,49,.16)}
.keybar.hidden{display:none}
/* pannelli */
.panels{display:grid;grid-template-columns:1fr 1fr}
.panel{min-width:0;padding:24px}.panel+.panel{border-left:1px solid var(--line)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:30px;margin-bottom:12px}
.panel-label{font-size:.82rem;font-weight:780;letter-spacing:.08em;text-transform:uppercase}
.status{color:var(--muted);font-size:.78rem;font-weight:650}.status[data-tone=error]{color:var(--danger)}
textarea{display:block;width:100%;min-height:310px;resize:vertical;border:0;outline:0;padding:4px 0;color:var(--ink);background:transparent;font-size:clamp(1.08rem,2vw,1.35rem);line-height:1.65;letter-spacing:.01em}
textarea::placeholder{color:#b0b2ac}
.panel-actions{display:flex;align-items:center;justify-content:flex-end;min-height:46px;margin-top:16px}
.translate-button,.copy-button{min-height:44px;padding:0 18px;border-radius:12px;font-size:.9rem;font-weight:750}
.translate-button{color:#fff;background:var(--accent)}.translate-button:hover{background:var(--accent-hover)}
.copy-button{border:1px solid var(--line);background:var(--surface)}.copy-button:hover{background:var(--soft)}
.message{min-height:20px;margin:14px 4px 0;color:var(--danger);font-size:.84rem;line-height:1.45}
.legacy-toggle{position:fixed;right:20px;bottom:20px;z-index:20;min-height:42px;padding:0 16px;border:1px solid rgba(23,24,22,.12);border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(29,34,30,.12);font-size:.82rem;font-weight:760;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.legacy-toggle:hover{background:rgba(255,255,255,.78)}
.legacy-panel{position:fixed;inset:20px;z-index:30;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.legacy-panel.hidden{display:none}
.legacy-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fafaf7}
.legacy-header span{font-size:.8rem;font-weight:780;letter-spacing:.08em;text-transform:uppercase}
.legacy-close{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.legacy-frame{width:100%;height:100%;border:0;background:#fff}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid rgba(35,61,49,.22);outline-offset:2px}
@media(max-width:760px){
  .shell{width:min(100% - 24px,680px);padding:28px 0}
  .masthead{align-items:center}
  .identity span{display:none}
  .toolbar{align-items:stretch}
  .mode-switch{flex:1}
  .mode-button{flex:1;padding-inline:8px}
  .levelbar{flex-wrap:wrap}
  .level-switch{order:2;width:100%}
  .panels{grid-template-columns:1fr}
  .panel+.panel{border-top:1px solid var(--line);border-left:0}
  textarea{min-height:210px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell">
<header class="masthead">
  <div class="identity"><h1 id="mainTitle" tabindex="0" role="button" aria-controls="levelbar" aria-expanded="false" aria-label="Mostra i livelli disponibili">cUX</h1><span>Traduttore</span></div>
  <button class="clear-button" id="clearButton" type="button">Svuota</button>
</header>
<section class="translator" aria-label="Traduttore cUX">
  <!-- direzione -->
  <div class="toolbar">
    <div class="mode-switch" role="tablist" aria-label="Direzione">
      <button class="mode-button" id="encodeMode" type="button" role="tab" aria-selected="true">Italiano → cUX</button>
      <button class="mode-button" id="decodeMode" type="button" role="tab" aria-selected="false">cUX → Italiano</button>
    </div>
    <button class="swap-button" id="swapButton" type="button" aria-label="Inverti direzione" title="Inverti direzione">⇄</button>
  </div>
  <!-- selezione livello -->
  <div class="levelbar hidden" id="levelbar">
    <div class="level-switch" role="tablist" aria-label="Livello di cifratura">
      <button class="level-btn" id="lvl1" type="button" role="tab" aria-selected="false">Livello 1</button>
      <button class="level-btn" id="lvl2" type="button" role="tab" aria-selected="false">Livello 2</button>
      <button class="level-btn" id="lvl3" type="button" role="tab" aria-selected="true">Livello 3</button>
    </div>
  </div>
  <!-- chiave (solo livello 3) -->
  <div class="keybar hidden" id="keybar">
    <label for="keyText">Chiave</label>
    <input id="keyText" value="" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Inserisci la chiave">
  </div>
  <!-- pannelli testo -->
  <div class="panels">
    <section class="panel">
      <div class="panel-head"><label class="panel-label" id="sourceLabel" for="sourceText">Italiano</label></div>
      <textarea id="sourceText" placeholder="Inserisci il testo" spellcheck="false" autocomplete="off" autocapitalize="off" data-gramm="false"></textarea>
      <div class="panel-actions"><button class="translate-button" id="translateButton" type="button">Traduci</button></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <label class="panel-label" id="targetLabel" for="targetText">cUX</label>
        <span class="status" id="status" aria-live="polite"></span>
      </div>
      <textarea id="targetText" readonly spellcheck="false" aria-label="Risultato"></textarea>
      <div class="panel-actions"><button class="copy-button" id="copyButton" type="button">Copia</button></div>
    </section>
  </div>
</section>
<p class="message" id="message" role="alert"></p>
</main>

<button class="legacy-toggle" id="legacyToggle" type="button" aria-expanded="false" aria-controls="legacyPanel">versione precedente</button>
<div class="legacy-panel hidden" id="legacyPanel" aria-label="versione precedente del traduttore">
  <div class="legacy-header">
    <span>Versione precedente</span>
    <button class="legacy-close" id="legacyClose" type="button">Chiudi</button>
  </div>
  <iframe class="legacy-frame" id="legacyFrame" title="versione precedente cUX" src="oldindex.html"></iframe>
</div>
